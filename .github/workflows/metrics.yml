name: GitHub Metrics
on:
  # Runs automatically every 24 hours
  schedule: [{cron: "0 0 * * *"}]
  # Allows you to run it manually from the Actions tab
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # This securely uses the secret token you just added
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Outputs the file to your repository
          filename: metrics.plugin.languages.svg
          
          # Disable base stats to only show languages
          base: ""
          
          # Enable Language tracking (including private repos)
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_languages_details: percentage
